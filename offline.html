<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06301c">

  <title>Offline · Broccoli Club</title>

  <style>
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      background: #06301c;
      color: #f7f3e8;
      font-family: "DM Sans", system-ui, sans-serif;
      text-align: center;
      padding: 32px;
    }

    h1 {
      font-family: "Manrope", sans-serif;
      font-size: 30px;
      letter-spacing: -.05em;
      margin: 0 0 12px;
    }

    p {
      font-size: 13.5px;
      line-height: 1.8;
      opacity: .75;
      max-width: 280px;
      margin: 0 auto 24px;
    }

    a {
      display: inline-block;
      background: #e3c886;
      color: #06301c;
      padding: 15px 26px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div>
    <h1>You are offline.</h1>
    <p>The menu may be available from your cache. Reconnect to submit an order.</p>
    <a href="./">Try again</a>
  </div>
</body>
</html>
